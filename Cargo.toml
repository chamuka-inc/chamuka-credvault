[workspace]
resolver = "2"
members = [
    "crates/credvault",
    "crates/credvault-import-pipedream",
]

# Shared package metadata. Each crate inherits these with `field.workspace = true`,
# so version/license/repository are defined once for the whole workspace.
[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.96"
authors = ["Chamuka, Inc. <swiftugandan@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/chamuka-inc/credvault"
homepage = "https://github.com/chamuka-inc/credvault"

# Shared dependency versions. Each crate opts in with `<dep>.workspace = true` and may
# add crate-specific features on top. One place to bump a version for the whole tree.
[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
axum = { version = "0.7", features = ["json", "query"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "timeout"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls", "postgres", "time", "macros", "migrate",
] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
secrecy = "0.8"
zeroize = "1"
aes-gcm-siv = "0.11"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
constant_time_eq = "0.5"
time = { version = "0.3", features = ["serde", "macros"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Internal crates. `path` builds the workspace locally; `version` lets the crate be
# published to crates.io (publish strips `path` and uses `version`).
credvault = { path = "crates/credvault", version = "1.0.0" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
