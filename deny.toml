# cargo-deny configuration — supply-chain policy for the dependency tree.
# Run locally with: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
# Fail on any unfixed RUSTSEC advisory or yanked crate. Add a documented entry to
# `ignore` (with the advisory id and a reason) only when a fix is genuinely unavailable.
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
# Permissive licenses compatible with this project's Apache-2.0 distribution.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    # CA-certificate bundle (webpki-roots) ships under this permissive data license.
    "CDLA-Permissive-2.0",
]

[bans]
# Surface accidental dependency bloat and footguns without hard-failing the build on
# transitive version skew we don't control.
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true

[sources]
# Only crates.io and explicitly-listed git sources are allowed.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
