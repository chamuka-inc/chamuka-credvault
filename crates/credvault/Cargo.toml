[package]
name = "credvault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Multi-tenant, multi-provider credential vault — the load-bearing layer of an integration platform."
documentation = "https://docs.rs/credvault"
readme = "README.md"
keywords = ["oauth", "credentials", "vault", "tokens", "secrets"]
categories = ["authentication", "cryptography", "web-programming::http-server"]

[[bin]]
name = "credvault"
path = "src/main.rs"

[lib]
name = "credvault"
path = "src/lib.rs"

[features]
default = []
# Compile the service against an in-process SQLite (tests/dev only). Production
# uses the default Postgres build.
sqlite = ["sqlx/sqlite"]

[dependencies]
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
sqlx.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
secrecy.workspace = true
zeroize.workspace = true
aes-gcm-siv.workspace = true
hmac.workspace = true
sha2.workspace = true
base64.workspace = true
rand.workspace = true
constant_time_eq.workspace = true
time.workspace = true
uuid.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Inherits the workspace tokio (and its features); adds `test-util` for time control.
tokio = { workspace = true, features = ["test-util"] }
