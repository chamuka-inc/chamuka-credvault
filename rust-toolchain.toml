# Toolchain used to build, lint, and test credvault. The crates declare
# `rust-version = "1.96"` as the MSRV (minimum supported); this is the toolchain
# contributors and CI actually run — current stable, with the rustfmt and clippy
# components the gates require. rustup installs it automatically on the first build.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
